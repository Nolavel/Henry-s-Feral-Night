name: freemans-sky-preview

on:
  push:
    branches: [gpt-freemans-sky-experiment]
    paths:
      - "shaders/environment/freemans_sky_quarter.gdshader"
      - "tools/runtime/capture_freemans_sky.gd"
      - ".github/workflows/freemans-sky-preview.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb unzip

      - name: Install Godot 4.8-dev6 Mono
        run: |
          curl -L -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.8-dev6/Godot_v4.8-dev6_mono_linux_x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -name '*.x86_64' | head -1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install Terrain3D 1.0.1 Linux binary
        run: |
          curl -L -o /tmp/terrain3d.zip \
            https://github.com/TokisanGames/Terrain3D/releases/download/v1.0.1-stable/Terrain3D_v1.0.1.zip
          rm -rf /tmp/terrain3d-release
          mkdir -p /tmp/terrain3d-release addons/terrain_3d/bin
          unzip -q /tmp/terrain3d.zip -d /tmp/terrain3d-release
          DEBUG_SO="$(find /tmp/terrain3d-release -type f -name 'libterrain.linux.debug.x86_64.so' | head -1)"
          RELEASE_SO="$(find /tmp/terrain3d-release -type f -name 'libterrain.linux.release.x86_64.so' | head -1)"
          test -n "$DEBUG_SO"
          cp "$DEBUG_SO" addons/terrain_3d/bin/libterrain.linux.debug.x86_64.so
          if [ -n "$RELEASE_SO" ]; then
            cp "$RELEASE_SO" addons/terrain_3d/bin/libterrain.linux.release.x86_64.so
          fi

      - name: Import project
        run: |
          "$GODOT_BIN" --headless --path . --import --quit || true

      - name: Render Freeman sky matrix
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          XDG_RUNTIME_DIR: /tmp/xdg
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a "$GODOT_BIN" \
            --path . \
            --rendering-method forward_plus \
            --rendering-driver vulkan \
            --audio-driver Dummy \
            --script tools/runtime/capture_freemans_sky.gd

      - name: Upload Freeman sky PNGs
        uses: actions/upload-artifact@v4
        with:
          name: freemans-sky-preview
          path: artifacts/freemans_sky/*.png
