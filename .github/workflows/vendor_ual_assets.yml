name: Vendor UAL animation assets

on:
  push:
    branches:
      - codex
    paths:
      - .github/workflows/vendor_ual_assets.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codex
        uses: actions/checkout@v4
        with:
          ref: codex
          fetch-depth: 0

      - name: Copy Quaternius UAL assets from DOGWATCH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/animation/ual/Unreal-Godot
          mkdir -p assets/animation/ual/Unreal-Godot_2

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Nolavel/DOGWATCH/main/assets/skeletons_and_animation_for_demo/Unreal-Godot/UAL1_Standard.glb" \
            --output assets/animation/ual/Unreal-Godot/UAL1_Standard.glb

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Nolavel/DOGWATCH/main/assets/skeletons_and_animation_for_demo/Unreal-Godot_2/UAL2_Standard.glb" \
            --output assets/animation/ual/Unreal-Godot_2/UAL2_Standard.glb

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Nolavel/DOGWATCH/main/assets/skeletons_and_animation_for_demo/License.txt" \
            --output assets/animation/ual/License.txt

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Nolavel/DOGWATCH/main/assets/skeletons_and_animation_for_demo/README.txt" \
            --output assets/animation/ual/README.txt

          test "$(stat -c%s assets/animation/ual/Unreal-Godot/UAL1_Standard.glb)" -gt 7000000
          test "$(stat -c%s assets/animation/ual/Unreal-Godot_2/UAL2_Standard.glb)" -gt 7000000

      - name: Commit vendored assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-asset-vendor"
          git config user.email "codex-asset-vendor@users.noreply.github.com"
          git add assets/animation/ual
          git rm .github/workflows/vendor_ual_assets.yml
          git commit -m "vendor Quaternius UAL skeleton and animations from DOGWATCH"
          git push origin HEAD:codex
