name: Rig Henry on UAL

on:
  push:
    branches:
      - codex
    paths:
      - .github/workflows/rig_henry_ual.yml
      - tools/blender/rig_henry_ual.py

permissions:
  contents: write

jobs:
  rig:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout codex
        uses: actions/checkout@v4
        with:
          ref: codex
          fetch-depth: 0

      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy xvfb libegl1 libgl1-mesa-dri libglu1-mesa
          blender --version
          blender --background --factory-startup --python-expr "import numpy; print('numpy', numpy.__version__)"

      - name: Rig Henry and render previews
        shell: bash
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a blender --background --factory-startup \
            --python tools/blender/rig_henry_ual.py
          test -s assets/models/characters/henry_ual/Henry_UAL_Rigged.glb

      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/models/characters/henry_ual/Henry_UAL_Rigged.glb
          test -s docs/rig_previews/henry_ual/idle_front.png
          test -s docs/rig_previews/henry_ual/walk_3q.png
          test -s docs/rig_previews/henry_ual/sprint_side.png
          test -s docs/rig_previews/henry_ual/stress_pose.png
          test -s docs/rig_previews/henry_ual/rig_report.json
          python3 - <<'PY'
          import json
          with open("docs/rig_previews/henry_ual/rig_report.json", encoding="utf-8") as f:
              r = json.load(f)
          assert r["bone_count"] >= 50, r
          for name, stats in r["weight_stats"].items():
              assert stats["unweighted_ratio"] < 0.01, (name, stats)
          print(json.dumps(r, indent=2))
          PY

      - name: Switch Henry visual to rigged GLB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scenes/actors/player/HenryUALVisual.tscn")
          text = path.read_text(encoding="utf-8")
          old = "res://assets/animation/ual/Unreal-Godot/UAL1_Standard.glb"
          new = "res://assets/models/characters/henry_ual/Henry_UAL_Rigged.glb"
          if old not in text and new not in text:
              raise SystemExit("UAL source path not found in HenryUALVisual.tscn")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Upload rig preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: henry-ual-rig-preview
          path: |
            assets/models/characters/henry_ual/Henry_UAL_Rigged.glb
            docs/rig_previews/henry_ual/*.png
            docs/rig_previews/henry_ual/rig_report.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit rigged Henry and previews
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-rig-pipeline"
          git config user.email "codex-rig-pipeline@users.noreply.github.com"
          git add \
            assets/models/characters/henry_ual/Henry_UAL_Rigged.glb \
            docs/rig_previews/henry_ual \
            scenes/actors/player/HenryUALVisual.tscn \
            tools/blender/rig_henry_ual.py
          git rm .github/workflows/rig_henry_ual.yml
          git commit -m "rig Henry mesh to UAL skeleton and add preview renders"
          git push origin HEAD:codex
