name: Capture Henry Locomotion

on:
  push:
    branches:
      - codex
    paths:
      - .github/workflows/capture_henry_locomotion.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout codex
        uses: actions/checkout@v4
        with:
          ref: codex
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip xvfb libgl1-mesa-dri libglu1-mesa libegl1 mesa-vulkan-drivers

      - name: Install Godot 4.8 dev6 Mono
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3             "https://github.com/godotengine/godot-builds/releases/download/4.8-dev6/Godot_v4.8-dev6_mono_linux_x86_64.zip"             --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d .godot-bin
          GODOT_BIN="$(find "$PWD/.godot-bin" -type f -name 'Godot_v4.8-dev6_mono_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Build C# project
        shell: bash
        run: |
          set -euo pipefail
          dotnet build 'Henry`s Feral Night.csproj' -c Debug

      - name: Import Godot resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .godot
          "$GODOT_BIN" --headless --editor --import --path .             --rendering-method gl_compatibility
          test -d .godot/imported
          test "$(find .godot/imported -type f | wc -l)" -gt 0

      - name: Run main scene locomotion capture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/runtime_previews/henry_locomotion
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 90s xvfb-run -a -s "-screen 0 1280x720x24"             "$GODOT_BIN" --path .             --rendering-method gl_compatibility             --script res://tools/runtime/capture_henry_locomotion.gd

      - name: Validate captures
        shell: bash
        run: |
          set -euo pipefail
          for file in idle.png walk.png jog_transition.png sprint.png runtime_report.json; do
            test -s "docs/runtime_previews/henry_locomotion/$file"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/runtime_previews/henry_locomotion/runtime_report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          captures = {c["state"]: c for c in report["captures"]}
          assert captures["idle"]["blend_position"] <= 0.05, captures["idle"]
          assert 0.30 <= captures["walk"]["blend_position"] <= 0.70, captures["walk"]
          assert captures["sprint"]["blend_position"] >= 0.85, captures["sprint"]
          assert captures["walk"]["horizontal_speed_mps"] > 2.0, captures["walk"]
          assert captures["sprint"]["horizontal_speed_mps"] > captures["walk"]["horizontal_speed_mps"], captures
          print(json.dumps(report, indent=2))
          PY

      - name: Upload locomotion preview
        uses: actions/upload-artifact@v4
        with:
          name: henry-main-scene-locomotion
          path: docs/runtime_previews/henry_locomotion
          if-no-files-found: error
          retention-days: 14

      - name: Commit previews and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-runtime-capture"
          git config user.email "codex-runtime-capture@users.noreply.github.com"
          git add docs/runtime_previews/henry_locomotion
          git rm .github/workflows/capture_henry_locomotion.yml
          git commit -m "capture Henry locomotion in main scene"
          git push origin HEAD:codex
