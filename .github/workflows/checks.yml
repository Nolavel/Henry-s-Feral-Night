name: checks

## Cheap gate for main: import, filename hygiene, headless test suites.
## Rendering remains opt-in. [startup-preview] captures the title card;
## [hud-preview] captures one staged production HFN frame with contextual HUD/action UI.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot-mono
          key: godot-4.8-dev6-v2

      - name: Provision Godot (headless only)
        run: SKIP_APT=1 tools/ci/setup_env.sh

      - name: Import gate (clean import, every script compiles)
        run: tools/ci/import_gate.sh

      - name: Input map overlaps
        run: python3 tools/ci/check_input_map.py

      - name: Check filenames and uid files
        run: tools/ci/check_filenames.sh

      - name: Run headless test suites
        run: tools/ci/run_tests.sh

      - name: Provision preview renderer
        if: github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[startup-preview]') || contains(github.event.pull_request.title, '[hud-preview]'))
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb

      - name: Render startup title preview
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[startup-preview]')
        run: tools/ci/render.sh res://tools/runtime/startup_title_preview.tscn res://artifacts/startup_squiggle.png 45

      - name: Upload startup title preview
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[startup-preview]')
        uses: actions/upload-artifact@v4
        with:
          name: startup-squiggle-preview
          path: artifacts/startup_squiggle.png
          if-no-files-found: error
          retention-days: 3

      - name: Render HFN action prompt preview
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[hud-preview]')
        run: tools/ci/render.sh res://tools/runtime/action_prompt_preview.tscn res://artifacts/action_prompt_preview.png 60

      - name: Upload HFN action prompt preview
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[hud-preview]')
        uses: actions/upload-artifact@v4
        with:
          name: action-prompt-preview
          path: artifacts/action_prompt_preview.png
          if-no-files-found: error
          retention-days: 3
