name: render-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Provision Godot and CPU Vulkan
        run: sudo -E tools/ci/setup_env.sh

      - name: Import project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          godot --headless --import --quit || true

      - name: Run headless test suites
        run: tools/ci/run_tests.sh

      - name: Render smoke scene
        run: tools/ci/render.sh res://tools/ci/render_smoke.tscn user://shots/smoke.png 25

      - name: Collect renders
        if: always()
        run: |
          mkdir -p artifacts
          find "$HOME/.local/share/godot/app_userdata" -name '*.png' -exec cp {} artifacts/ \;

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: artifacts/
