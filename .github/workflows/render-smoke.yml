name: render-smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Provision Godot and CPU Vulkan
        run: tools/ci/setup_env.sh

      - name: Import project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          godot --headless --import --quit || true

      - name: Check filenames and uid files
        run: tools/ci/check_filenames.sh

      - name: Run headless test suites
        run: tools/ci/run_tests.sh

      - name: Render smoke scene
        run: tools/ci/render.sh res://tools/ci/render_smoke.tscn user://shots/smoke.png 25

      - name: Render snowflake collision and live-wind matrix
        if: github.ref == 'refs/heads/codex'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export VK_DRIVER_FILES="${VK_DRIVER_FILES:-/usr/share/vulkan/icd.d/lvp_icd.json}"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp/xdg}"
          mkdir -p "$XDG_RUNTIME_DIR"
          xvfb-run -a godot \
            --path . \
            --rendering-driver vulkan \
            --rendering-method forward_plus \
            --audio-driver Dummy \
            --script tools/runtime/capture_wind_snow_test.gd

      - name: Collect renders
        if: always()
        run: |
          mkdir -p artifacts
          find "$HOME/.local/share/godot/app_userdata" -name '*.png' \
            -exec cp {} artifacts/ \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders
          path: artifacts/
