name: Validate Visual FX Shaders

on:
  push:
    branches:
      - codex
    paths:
      - .github/workflows/validate_visual_fx_shaders.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex
          fetch-depth: 0

      - name: Install software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip xvfb libegl1 libgl1-mesa-dri libglu1-mesa mesa-vulkan-drivers
          VULKAN_ICD="$(find /usr/share/vulkan/icd.d -type f -name '*lvp*.json' | head -n 1)"
          test -n "$VULKAN_ICD"
          echo "VK_ICD_FILENAMES=$VULKAN_ICD" >> "$GITHUB_ENV"

      - name: Install Godot 4.8 dev6 Mono
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3             "https://github.com/godotengine/godot-builds/releases/download/4.8-dev6/Godot_v4.8-dev6_mono_linux_x86_64.zip"             -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d .godot-bin
          GODOT_BIN="$(find "$PWD/.godot-bin" -type f -name 'Godot_v4.8-dev6_mono_linux.x86_64' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Validate shader resources
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s xvfb-run -a -s "-screen 0 1280x720x24"             "$GODOT_BIN" --path . --rendering-method forward_plus             --script res://tools/runtime/validate_visual_fx.gd             2>&1 | tee /tmp/visual_fx.log

          grep -q "\[HFN_VISUAL_FX\] FadeVolume loaded" /tmp/visual_fx.log
          grep -q "\[HFN_VISUAL_FX\] StylizedShadows loaded" /tmp/visual_fx.log
          ! grep -q "Shader compilation failed" /tmp/visual_fx.log
          ! grep -q "Failed to compile shader" /tmp/visual_fx.log

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-visual-fx"
          git config user.email "codex-visual-fx@users.noreply.github.com"
          git rm .github/workflows/validate_visual_fx_shaders.yml
          git commit -m "ci: remove visual FX validation workflow"
          git push origin HEAD:codex
