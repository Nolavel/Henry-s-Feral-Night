name: Capture Depth Normal Compositor Outline

on:
  push:
    branches:
      - codex
    paths:
      - .github/workflows/capture_outline_compositor.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout codex
        uses: actions/checkout@v4
        with:
          ref: codex
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip xvfb libegl1 libgl1-mesa-dri libglu1-mesa mesa-vulkan-drivers
          VULKAN_ICD="$(find /usr/share/vulkan/icd.d -type f -name '*lvp*.json' | head -n 1)"
          test -n "$VULKAN_ICD"
          echo "VK_ICD_FILENAMES=$VULKAN_ICD" >> "$GITHUB_ENV"

      - name: Install Godot 4.8 dev6 Mono
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          curl --fail --location --retry 3             "https://github.com/godotengine/godot-builds/releases/download/4.8-dev6/Godot_v4.8-dev6_mono_linux_x86_64.zip"             -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d .godot-bin
          GODOT_BIN="$(find "$PWD/.godot-bin" -type f -name 'Godot_v4.8-dev6_mono_linux.x86_64' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Build C# and import Forward Plus resources
        shell: bash
        run: |
          set -euo pipefail
          dotnet build 'Henry`s Feral Night.csproj' -c Debug
          rm -rf .godot
          "$GODOT_BIN" --headless --editor --import --path . --rendering-method forward_plus

      - name: Capture compositor outline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/runtime_previews/outline_compositor
          timeout 90s xvfb-run -a -s "-screen 0 1280x720x24"             "$GODOT_BIN" --path . --rendering-method forward_plus             --script res://tools/runtime/capture_outline_compositor.gd
          test -s docs/runtime_previews/outline_compositor/compositor_depth_normal.png

      - name: Upload compositor preview
        uses: actions/upload-artifact@v4
        with:
          name: hfn-depth-normal-compositor-outline
          path: docs/runtime_previews/outline_compositor/compositor_depth_normal.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit preview and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-outline-compositor"
          git config user.email "codex-outline-compositor@users.noreply.github.com"
          git add docs/runtime_previews/outline_compositor/compositor_depth_normal.png
          git rm .github/workflows/capture_outline_compositor.yml
          git commit -m "capture depth-normal compositor outline preview"
          git push origin HEAD:codex
